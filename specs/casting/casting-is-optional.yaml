kind: specification
id: anime.casting.casting-is-optional
title: Casting is optional and its absence is explained
state: live
autonomy: gated
behavior: >
  Casting depends on the separate Home Assistant app. Without it installed, asking to cast says
  exactly that and names what to install; nothing else about the app is affected, and searching,
  browsing and watching in a browser work identically.
implements:
- tools.py::cast_anime_episode
tests: []
links: {}
notes: >
  Anime is installed on its own; a hard dependency on another optional app would make it
  uninstallable in a household that wants only one of the two.
