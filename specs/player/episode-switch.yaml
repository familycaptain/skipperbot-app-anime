kind: specification
id: anime.player.episode-switch
title: Changing episode plays the new episode
state: live
autonomy: gated
behavior: >
  When someone moves to a different episode — Next, Prev, or the picker — the player stops what it
  was playing and starts what they chose: the episode label, the resolved stream and the video that
  is actually on screen all refer to the new episode. A changed label over the previous episode's
  video is the failure this rules out. The new episode starts at its own remembered position, or at
  the beginning if it has none, never at the position of the one before it.
implements:
- ui/AnimePlayerApp.jsx::AnimePlayerApp
- static/anime-player.html::attach
tests:
- type: e2e
  path: tests/e2e/test_player_episode_switch.py
  rubric: >
    Drives the real player in a browser against a live install. Starts an episode, records which
    upstream media the player is actually fetching, moves to the next episode, and requires that
    the label changed, that media belonging only to the previous episode stops being fetched within
    a few seconds, and that media distinct to the new episode is fetched. Skips rather than fails
    when the third-party catalog cannot be reached at all, since upstream availability is not what
    is under test.
links: {}
notes: >
  The bug this was written against changed the label and even the requested playlist while the
  video kept playing the previous episode, so the acceptance point is deliberately the media that
  loads rather than anything on screen.
